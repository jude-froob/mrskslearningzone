<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Number Bond Face-Off</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#2B2440;
  --paper:#FFFDF6;
  --grass:#7CCB5B;
  --grass-dark:#5BAE3F;
  --dirt:#D9A86C;
  --dirt-dark:#C48F52;
  --good:#2E9E4F;
  --bad:#E5484D;
  --font:'Baloo 2','Segoe UI','Century Gothic',Arial,sans-serif;
}

html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  height:100dvh;
  display:grid;
  grid-template-rows:minmax(0,1fr) minmax(0,auto) minmax(0,1fr);
  font-family:var(--font);
  color:var(--ink);
  background:var(--grass-dark);
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

/* ── PLAYER HALVES ── */
.half{
  min-height:0;
  padding:2vmin;
  display:flex;
}
.half.top{transform:rotate(180deg)}   /* faces the player on the far side */
.panel{
  flex:1;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr);
  gap:1.4vmin 2.4vmin;
  min-height:0;
  padding:1.6vmin 2.4vmin 2.4vmin;
  background:var(--dim);
  border-radius:24px;
  border-top:10px solid var(--col);
  box-shadow:0 5px 0 rgba(0,0,0,.18);
}
.panel-head{
  grid-column:1 / -1;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-weight:800;
  font-size:clamp(18px,3.4vmin,38px);
  line-height:1.1;
}
.panel-head .score{
  background:var(--col);color:#fff;
  padding:.05em .6em;border-radius:999px;
  font-size:.85em;white-space:nowrap;
}
.bond{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
.bond svg{width:100%;height:100%;overflow:visible}
.bond line{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.bond circle{fill:#fff;stroke:var(--col);stroke-width:5}
.bond circle.missing{fill:#FFF6C9;stroke:var(--ink);stroke-dasharray:7 6;stroke-width:4}
.bond text{
  font-family:var(--font);font-weight:800;font-size:34px;
  fill:var(--ink);text-anchor:middle;dominant-baseline:central;
}
.bond text.q{fill:#A08A3C}
.panel.right .bond circle.missing{fill:#C8F2D2;stroke:var(--good);stroke-dasharray:none}
.panel.wrong .bond circle.missing{fill:#FFD9DA;stroke:var(--bad);stroke-dasharray:none}
.panel.wrong .bond{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.mark{
  position:absolute;right:2%;top:0;
  font-size:clamp(28px,7vmin,64px);font-weight:800;
  opacity:0;transform:scale(.4);transition:all .2s;
}
.panel.right .mark,.panel.wrong .mark{opacity:1;transform:scale(1)}
.panel.right .mark{color:var(--good)}
.panel.wrong .mark{color:var(--bad)}

.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(4,minmax(0,1fr));
  gap:clamp(6px,1.2vmin,12px);
  min-height:0;
}
.key{
  min-height:0;
  border:none;border-radius:16px;
  background:#fff;color:var(--ink);
  font-family:var(--font);font-weight:800;
  font-size:clamp(22px,5vmin,48px);
  box-shadow:0 4px 0 rgba(43,36,64,.22);
  cursor:pointer;
  touch-action:manipulation;
}
.key.pressed{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,36,64,.22)}
.key.del{background:#F2EEE6}
.key.go{background:var(--col);color:#fff}
.panel.locked .key{opacity:.6}

/* ── RACE TRACK (middle) ── */
.track{
  position:relative;
  height:clamp(170px,30vh,400px);
  display:grid;
  grid-template-rows:1fr 1.25fr 1.25fr 1fr;
  padding:0 2vmin;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 60px,transparent 60px 120px),
    linear-gradient(#78C858,#62B444);
}
/* each player's countryside; the two skies meet in the middle */
.scene-strip{position:relative;overflow:hidden;margin:0 -2vmin}
.scene-strip.top{transform:rotate(180deg)}
.scene-strip svg{position:absolute;inset:0;width:100%;height:100%}
.drift{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-400px)}to{transform:translateX(3600px)}}
.blades{transform-box:view-box;transform-origin:330px 132px;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.lane{
  display:grid;
  grid-template-columns:clamp(14px,2.4vmin,24px) minmax(0,1fr) clamp(22px,3.4vmin,36px);
  min-height:0;
  margin:clamp(5px,.8vh,10px) 0;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 3px 0 rgba(60,40,20,.25), inset 0 3px 0 rgba(0,0,0,.08);
}
.lane.top{transform:rotate(180deg)}   /* so the top player's animal runs left-to-right for them */
.start{background:var(--col);border-right:4px solid #fff}
.run{
  position:relative;
  background:
    repeating-linear-gradient(90deg,transparent 0 calc(100%/var(--steps) - 2px),rgba(255,255,255,.35) calc(100%/var(--steps) - 2px) calc(100%/var(--steps))),
    radial-gradient(circle at 20% 30%,rgba(120,80,40,.25) 0 2px,transparent 3px) 0 0/37px 23px,
    radial-gradient(circle at 70% 70%,rgba(255,240,210,.35) 0 1.5px,transparent 2.5px) 0 0/29px 19px,
    linear-gradient(#E2B57A,var(--dirt) 40%,var(--dirt-dark));
}
.finish{border-left:3px solid #fff;background:repeating-conic-gradient(#222 0 25%,#fff 0 50%) 0 0/12px 12px}
.runner{
  position:absolute;top:50%;
  left:calc(var(--p) * (100% - 1.1em));
  transform:translateY(-50%);
  font-size:clamp(26px,5.5vh,70px);
  line-height:1;
  transition:left .55s cubic-bezier(.4,1.4,.6,1);
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.18));
}
.runner span{display:inline-block}
.runner.hop span{animation:hop .55s ease-out}
@keyframes hop{0%{transform:translateY(0)}45%{transform:translateY(-38%) rotate(-8deg)}100%{transform:translateY(0)}}

.tools{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;gap:10px;z-index:2;
}
.tool{
  width:clamp(40px,6vmin,56px);height:clamp(40px,6vmin,56px);
  border:none;border-radius:50%;
  background:rgba(255,255,255,.92);
  font-size:clamp(18px,3vmin,28px);
  cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.18);
  touch-action:manipulation;
}

/* ── OVERLAYS ── */
.overlay{
  position:fixed;inset:0;z-index:20;
  display:flex;align-items:center;justify-content:center;
  background:rgba(43,36,64,.55);
  padding:3vmin;
}
.overlay.hidden{display:none}
.card{
  background:var(--paper);
  border-radius:28px;
  padding:clamp(18px,4vmin,44px);
  width:min(640px,94vw);
  max-height:94dvh;
  text-align:center;
  box-shadow:0 10px 0 rgba(0,0,0,.2);
  display:flex;flex-direction:column;gap:clamp(10px,2.4vmin,24px);
  overflow:hidden;
}
.back{
  align-self:flex-start;
  display:inline-flex;align-items:center;gap:8px;
  background:#CDEFF6;border-radius:999px;padding:6px 16px;
  font-weight:800;font-size:clamp(14px,2.2vmin,18px);
  color:var(--ink);text-decoration:none;
}
.card h1{font-size:clamp(30px,7vmin,64px);line-height:1}
.card .sub{font-size:clamp(16px,3vmin,26px);font-weight:600;opacity:.8}
.racers{font-size:clamp(40px,10vmin,90px)}
.opt-label{font-weight:800;font-size:clamp(16px,2.8vmin,24px);margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.opt{
  min-height:clamp(48px,8vmin,68px);
  padding:0 1em;
  border:3px solid rgba(43,36,64,.2);
  border-radius:16px;
  background:#fff;
  font-family:var(--font);font-weight:800;
  font-size:clamp(16px,3vmin,26px);color:var(--ink);
  cursor:pointer;touch-action:manipulation;
}
.opt.on{background:#FFE27A;border-color:var(--ink)}
.big-btn{
  align-self:center;
  min-height:clamp(56px,10vmin,84px);
  padding:0 1.6em;
  border:none;border-radius:999px;
  background:var(--good);color:#fff;
  font-family:var(--font);font-weight:800;
  font-size:clamp(20px,4.4vmin,38px);
  box-shadow:0 6px 0 #1F7438;
  cursor:pointer;touch-action:manipulation;
}
.big-btn.alt{background:#fff;color:var(--ink);box-shadow:0 6px 0 rgba(43,36,64,.25);border:3px solid rgba(43,36,64,.2)}
.tip{font-size:clamp(14px,2.4vmin,20px);font-weight:600;opacity:.7}

/* split overlays: one half for each player */
.split{
  position:fixed;inset:0;z-index:20;
  display:grid;grid-template-rows:1fr auto 1fr;
  background:rgba(43,36,64,.85);
}
.split.hidden{display:none}
.split .side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vmin;color:#fff;text-align:center;padding:2vmin}
.split .side.top{transform:rotate(180deg)}
.side .big{font-size:clamp(80px,22vmin,220px);font-weight:800;line-height:1;color:#FFE27A;text-shadow:0 8px 0 rgba(0,0,0,.25)}
.side .big.pop{animation:pop .8s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
.side .msg{font-size:clamp(30px,8vmin,72px);font-weight:800;line-height:1.05;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.side .detail{font-size:clamp(18px,3.6vmin,32px);font-weight:700}
.side .animal{font-size:clamp(60px,16vmin,150px);line-height:1}
.side.won .animal{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10%) rotate(6deg)}}
.split .mid{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:1vmin}
.confetti{position:fixed;top:-5vh;width:12px;height:18px;border-radius:3px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}

@media (prefers-reduced-motion:reduce){
  .runner,.runner.hop span,.side.won .animal,.side .big.pop,.panel.wrong .bond,.drift,.blades{animation:none;transition:none}
}
</style>
</head>
<body>

<section class="track" id="track">
  <div class="lane top" id="lane1"></div>
  <div class="scene-strip top" id="scene1"></div>
  <div class="scene-strip" id="scene0"></div>
  <div class="lane" id="lane0"></div>
  <div class="tools">
    <button class="tool" id="muteBtn" aria-label="Sound on or off">🔊</button>

<template id="sceneTpl">

</template>

<div class="overlay" id="startScreen">
  <div class="card">
    <a class="back" href="../index.html"><span>&larr;</span>Back to Mrs K's Learning Zone</a>
    <div class="racers">🐰 vs 🦊</div>
    <h1>Number Bond Face-Off</h1>
    <p class="sub">Sit opposite each other with the iPad flat between you.</p>
    <div>
      <p class="opt-label">Which bonds?</p>
      <div class="opts" id="modeOpts"></div>
    </div>
    <button class="big-btn" id="startBtn">Ready, set&hellip; go! 🏁</button>
    <p class="tip">Tip: turn on Rotation Lock so the screen doesn't flip.</p>

</div>

<div class="split hidden" id="countdown">
  <div class="side top"><div class="big" id="cd1"></div></div>
  <div></div>

</div>

<div class="split hidden" id="winScreen">
  <div class="side top" id="win1"></div>
  <div class="mid">
    <button class="big-btn" id="againBtn">Race again 🔁</button>
    <button class="big-btn alt" id="changeBtn">Change ⚙️</button>
  </div>
  <div class="side" id="win0"></div>

<script>
/* ════════════════════════════════════════════
   EASY TO CHANGE
   ════════════════════════════════════════════ */

// How many correct answers to reach the finish line
const RACE_LENGTH = 10;

// How long a player waits after a wrong answer (milliseconds)
const WRONG_PAUSE = 900;

// The two players: first = bottom of the iPad, second = top
const PLAYERS = [
  { name: 'Rabbit', animal: '🐰', col: '#E8577A', dim: '#FFE3EA' },
  { name: 'Fox',    animal: '🦊', col: '#E9822B', dim: '#FFEBD8' },
];

// The choices on the start screen.
//   whole: every bond has this whole number (a part is missing)
//   upTo:  the whole changes each time, up to this number (any circle can be missing)
const MODES = [
  { label: 'Bonds to 5',  whole: 5 },
  { label: 'Bonds to 10', whole: 10 },
  { label: 'Bonds to 20', whole: 20 },
  { label: 'Mixed to 10', upTo: 10 },
  { label: 'Mixed to 20', upTo: 20 },
];

/* ════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
let modeIndex = 1;
let state = [];
let playing = false;

/* ── Sound ── */
let audio = null, muted = false;
function tone(freq, start, dur, type = 'sine', vol = .18) {
  if (muted) return;
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  const t = audio.currentTime + start;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(audio.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  right: () => { tone(660, 0, .12); tone(990, .1, .18); },
  wrong: () => tone(170, 0, .3, 'square', .08),
  beep:  () => tone(520, 0, .2),
  go:    () => tone(880, 0, .35),
  win:   () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .13, .3, 'triangle')),
};

/* ── Questions ── */
const rand = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
function makeQuestion(prev) {
  const mode = MODES[modeIndex];
  let q;
  do {
    if (mode.whole) {
      const w = mode.whole, a = rand(0, w);
      q = { vals: [w, a, w - a], missing: rand(1, 2) };
    } else {
      const w = rand(2, mode.upTo), a = rand(1, w - 1);
      q = { vals: [w, a, w - a], missing: rand(0, 2) };
    }
  } while (prev && prev.vals.join() === q.vals.join() && prev.missing === q.missing);
  return q;
}

/* ── Build the screen ── */
function buildOptions() {
  $('modeOpts').innerHTML = MODES.map((m, i) =>
    `<button class="opt${i === modeIndex ? ' on' : ''}" data-mode="${i}">${m.label}</button>`).join('');
}
$('modeOpts').addEventListener('click', e => {
  const b = e.target.closest('[data-mode]'); if (!b) return;
  modeIndex = +b.dataset.mode; buildOptions();
});

function buildBoard() {
  $('track').style.setProperty('--steps', RACE_LENGTH);
  const keys = ['1','2','3','4','5','6','7','8','9','del','0','go'];
  PLAYERS.forEach((p, i) => {
    const lane = $(`lane${i}`);
    lane.style.setProperty('--col', p.col);
    lane.innerHTML = `<div class="start"></div>
      <div class="run"><div class="runner" id="runner${i}" style="--p:0"><span>${p.animal}</span></div></div>
      <div class="finish"></div>`;

    const panel = $(`panel${i}`);
    panel.style.setProperty('--col', p.col);
    panel.style.setProperty('--dim', p.dim);
    panel.innerHTML = `
      <div class="panel-head">
        <span>${p.animal} ${p.name}</span>
        <span class="score" id="score${i}">0 / ${RACE_LENGTH}</span>
      </div>
      <div class="bond">
        <svg viewBox="0 0 220 150" preserveAspectRatio="xMidYMid meet" aria-live="polite">
          <line x1="110" y1="40" x2="48" y2="110"/><line x1="110" y1="40" x2="172" y2="110"/>
          <circle id="c${i}_0" cx="110" cy="40" r="34"/><text id="t${i}_0" x="110" y="42"></text>
          <circle id="c${i}_1" cx="48" cy="110" r="34"/><text id="t${i}_1" x="48" y="112"></text>
          <circle id="c${i}_2" cx="172" cy="110" r="34"/><text id="t${i}_2" x="172" y="112"></text>
        </svg>
        <span class="mark" id="mark${i}"></span>
      </div>
      <div class="keypad">
        ${keys.map(k => k === 'del' ? `<button class="key del" data-k="del" aria-label="Delete">⌫</button>`
                   : k === 'go'  ? `<button class="key go" data-k="go" aria-label="Check">✓</button>`
                   : `<button class="key" data-k="${k}">${k}</button>`).join('')}
      </div>`;
  });
}

function drawQuestion(i) {
  const s = state[i];
  for (let c = 0; c < 3; c++) {
    const circle = $(`c${i}_${c}`), text = $(`t${i}_${c}`);
    const isMissing = c === s.q.missing;
    circle.classList.toggle('missing', isMissing);
    text.classList.toggle('q', isMissing && !s.input);
    text.textContent = isMissing ? (s.input || '?') : s.q.vals[c];
  }
}

/* ── Playing ── */
function press(i, k) {
  const s = state[i];
  if (!playing || s.locked) return;
  if (k === 'del') {
    s.input = s.input.slice(0, -1);
  } else if (k === 'go') {
    if (s.input) check(i);
    return;
  } else if (s.input.length < 2) {
    s.input = s.input === '0' ? k : s.input + k;
  }
  drawQuestion(i);
}

function check(i) {
  const s = state[i], panel = $(`panel${i}`);
  const right = +s.input === s.q.vals[s.q.missing];
  s.locked = true;
  panel.classList.add(right ? 'right' : 'wrong', 'locked');
  $(`mark${i}`).textContent = right ? '✓' : '✗';

  if (right) {
    sfx.right();
    s.progress++;
    $(`score${i}`).textContent = `${s.progress} / ${RACE_LENGTH}`;
    const runner = $(`runner${i}`);
    runner.style.setProperty('--p', s.progress / RACE_LENGTH);
    runner.classList.remove('hop'); void runner.offsetWidth; runner.classList.add('hop');
    if (s.progress >= RACE_LENGTH) { finish(i); return; }
  } else {
    sfx.wrong();
  }

  setTimeout(() => {
    panel.classList.remove('right', 'wrong', 'locked');
    s.input = '';
    if (right) s.q = makeQuestion(s.q);
    s.locked = false;
    drawQuestion(i);
  }, right ? 650 : WRONG_PAUSE);
}

// pointerdown (not click) so both players' touches count at the same time
document.querySelectorAll('.panel').forEach(panel => {
  panel.addEventListener('pointerdown', e => {
    const key = e.target.closest('.key'); if (!key) return;
    e.preventDefault();
    key.classList.add('pressed');
    setTimeout(() => key.classList.remove('pressed'), 120);
    press(+panel.dataset.player, key.dataset.k);
  });
  // keyboard users (Tab + Enter/Space)
  panel.addEventListener('click', e => {
    if (e.detail !== 0) return;
    const key = e.target.closest('.key'); if (!key) return;
    press(+panel.dataset.player, key.dataset.k);
  });
});
// stop pinch-zoom on iPad when both players tap at once
document.addEventListener('gesturestart', e => e.preventDefault());

function startRace() {
  $('startScreen').classList.add('hidden');
  $('winScreen').classList.add('hidden');
  buildBoard();
  state = PLAYERS.map(() => ({ progress: 0, input: '', locked: false, q: makeQuestion() }));
  state.forEach((s, i) => drawQuestion(i));
  playing = false;

  const cd = $('countdown');
  cd.classList.remove('hidden');
  ['3', '2', '1', 'Go!'].forEach((txt, n) => setTimeout(() => {
    ['cd0', 'cd1'].forEach(id => {
      const el = $(id);
      el.textContent = txt;
      el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    });
    n < 3 ? sfx.beep() : sfx.go();
    if (n === 3) setTimeout(() => { cd.classList.add('hidden'); playing = true; }, 600);
  }, n * 800));
}

function finish(winner) {
  playing = false;
  sfx.win();
  PLAYERS.forEach((p, i) => {
    const won = i === winner;
    const side = $(`win${i}`);
    side.classList.toggle('won', won);
    side.innerHTML = won
      ? `<div class="animal">${p.animal}</div><div class="msg">You win! 🏆</div><div class="detail">${state[i].progress} / ${RACE_LENGTH}</div>`
      : `<div class="animal">${p.animal}</div><div class="msg">Good try! 🌟</div><div class="detail">${state[i].progress} / ${RACE_LENGTH}</div>`;
  });
  setTimeout(() => { $('winScreen').classList.remove('hidden'); confetti(); }, 700);
}

function confetti() {
  const cols = PLAYERS.map(p => p.col).concat('#FFD43B', '#fff', '#2E9E4F');
  for (let n = 0; n < 60; n++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cols[n % cols.length];
    c.style.animationDuration = 2 + Math.random() * 2.5 + 's';
    c.style.animationDelay = Math.random() * .8 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5500);
  }
}

/* ── Buttons ── */
$('startBtn').addEventListener('click', startRace);
$('againBtn').addEventListener('click', startRace);
$('changeBtn').addEventListener('click', () => { $('winScreen').classList.add('hidden'); $('startScreen').classList.remove('hidden'); });
$('menuBtn').addEventListener('click', () => { playing = false; $('startScreen').classList.remove('hidden'); });
$('muteBtn').addEventListener('click', () => { muted = !muted; $('muteBtn').textContent = muted ? '🔇' : '🔊'; });
$('fsBtn').addEventListener('click', () => {
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
});

/* ── Scenery: the repeated bits (snow, trees, fence, flowers) ── */
function buildScene(n) {
  $(`snow-${n}`).innerHTML = [[120,120],[320,82],[540,112],[780,96],[1010,116],[1260,92],[1500,122]]
    .map(([x, y]) => `<path d="M${x} ${y} L${x-22} ${y+19} L${x-9} ${y+15} L${x} ${y+24} L${x+10} ${y+15} L${x+23} ${y+20}Z"/>`).join('');

  const tree = ([x, y, s, kind]) => kind === 'pine'
    ? `<g transform="translate(${x} ${y}) scale(${s})">
         <rect x="-3" y="-8" width="6" height="10" fill="#7A4E2A"/>
         <path d="M0 -50 L-16 -22 L-8 -22 L-20 -6 L20 -6 L8 -22 L16 -22Z" fill="#3E8E4E"/>
         <path d="M0 -50 L-8 -36 L0 -36Z" fill="#5AAE62"/>
       </g>`
    : `<g transform="translate(${x} ${y}) scale(${s})">
         <rect x="-4" y="-14" width="8" height="16" rx="2" fill="#7A4E2A"/>
         <circle cy="-30" r="20" fill="#4FA65A"/>
         <circle cx="-7" cy="-36" r="9" fill="#6CC070"/>
       </g>`;
  $(`farTrees-${n}`).innerHTML = [
    [60,214,.7,'pine'],[88,219,.55,'pine'],[480,218,.8,'round'],[512,222,.6,'round'],[700,198,.7,'pine'],
    [732,203,.9,'pine'],[905,212,.7,'round'],[1320,190,.8,'pine'],[1350,194,.6,'pine'],[1555,206,.8,'round'],
  ].map(tree).join('');
  $(`midTrees-${n}`).innerHTML = [
    [210,244,1.1,'round'],[250,246,.8,'round'],[620,246,1.2,'round'],[1000,250,1,'pine'],
    [1036,252,1.3,'pine'],[1240,246,.9,'round'],[1470,242,1.1,'round'],
  ].map(tree).join('');

  let bushes = '';
  for (let x = 30; x < 1600; x += 140) {
    bushes += `<circle cx="${x}" cy="266" r="16"/><circle cx="${x + 18}" cy="260" r="20"/><circle cx="${x + 40}" cy="267" r="15"/>`;
  }
  $(`bushes-${n}`).innerHTML = bushes;

  let fence = `<rect x="0" y="246" width="1600" height="7" rx="3" fill="url(#woodG-${n})" stroke="#8B5A2B" stroke-width="1.5"/>
               <rect x="0" y="266" width="1600" height="7" rx="3" fill="url(#woodG-${n})" stroke="#8B5A2B" stroke-width="1.5"/>`;
  for (let x = 12; x < 1600; x += 54) {
    fence += `<path d="M${x} 288 L${x} 240 L${x + 5} 234 L${x + 10} 240 L${x + 10} 288Z" fill="url(#woodG-${n})" stroke="#8B5A2B" stroke-width="1.5"/>`;
  }
  $(`fence-${n}`).innerHTML = fence;

  const petals = ['#FFFFFF', '#FFD43B', '#FF8FAB', '#B197FC'];
  let flowers = '';
  for (let n = 0, x = 20; x < 1600; n++, x += 37 + (n * 53) % 41) {
    const y = 286 + (n * 7) % 10;
    flowers += `<circle cx="${x}" cy="${y}" r="4" fill="${petals[n % 4]}"/><circle cx="${x}" cy="${y}" r="1.6" fill="#F59F00"/>`;
  }
  $(`flowers-${n}`).innerHTML = flowers;
}

// one countryside for each player, each with its own ids
function makeScene(n) {
  const html = $('sceneTpl').innerHTML
    .replace(/id="(\w+)"/g, `id="$1-${n}"`)
    .replace(/url\(#(skyG|mtnG|woodG)\)/g, `url(#$1-${n})`)
    .replace(/href="#land"/g, `href="#land-${n}"`);
  $(`scene${n}`).innerHTML = html;
  buildScene(n);
}

makeScene(0);
makeScene(1);
buildOptions();
buildBoard();
state = PLAYERS.map(() => ({ progress: 0, input: '', locked: true, q: makeQuestion() }));
state.forEach((s, i) => drawQuestion(i));
</script>
