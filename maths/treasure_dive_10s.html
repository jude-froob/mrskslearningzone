<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Dive Counting - Skip Counting by 10s</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', cursive, sans-serif;
    background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%);
    min-height: 100vh;
}

.page-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    max-width: 800px;
    width: 100%;
    background: white;
    border-radius: 30px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    padding: 40px;
    text-align: center;
}

h1 {
    color: #146c8e;
    font-size: 2.5em;
    margin-bottom: 10px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
}

.subtitle {
    color: #666;
    font-size: 1.1em;
    margin-bottom: 40px;
}

.screen { display: none; }
.screen.active { display: block; }

/* Level Selection */
.level-selection {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin: 40px 0;
}

.level-btn {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    padding: 26px 16px;
    border-radius: 20px;
    font-size: 1.2em;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
}
.level-btn:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(102, 126, 234, 0.5); }

.level-btn.level2 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); box-shadow: 0 10px 25px rgba(245, 87, 108, 0.3); }
.level-btn.level2:hover { box-shadow: 0 15px 35px rgba(245, 87, 108, 0.5); }

.level-btn.level3 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); box-shadow: 0 10px 25px rgba(79, 172, 254, 0.3); }
.level-btn.level3:hover { box-shadow: 0 15px 35px rgba(79, 172, 254, 0.5); }

.level-btn.level4 { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); box-shadow: 0 10px 25px rgba(253, 160, 133, 0.35); }
.level-btn.level4:hover { box-shadow: 0 15px 35px rgba(253, 160, 133, 0.55); }

.level-label { font-size: 0.78em; opacity: 0.95; margin-top: 8px; }

/* Game Screen */
.game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding: 15px;
    background: #f0f0f0;
    border-radius: 15px;
    flex-wrap: wrap;
    gap: 8px;
}
.level-display { font-size: 1.05em; font-weight: bold; color: #146c8e; }
.score-display { font-size: 1.4em; font-weight: bold; color: #d4a017; }
.question-counter { font-size: 0.9em; color: #888; margin-bottom: 20px; }

/* Seabed path progress */
.ocean-path {
    background: linear-gradient(to bottom, #1f6a8c, #0b3c56);
    border-radius: 20px;
    padding: 22px;
    margin: 10px 0 24px;
    border: 3px solid #0b3c56;
}
.progress-bar-container {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 15px;
    overflow: hidden;
    border: 2px solid rgba(255, 255, 255, 0.3);
    height: 50px;
    display: flex;
    align-items: center;
}
.progress-bar {
    background: linear-gradient(90deg, #ffd76e, #ffb300);
    height: 100%;
    width: 0%;
    transition: width 0.5s ease;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 10px;
}
.diver-emoji { font-size: 2.4em; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3)); }

/* Rule badge */
.rule-badge {
    display: inline-block;
    padding: 10px 26px;
    border-radius: 50px;
    font-size: 1.3em;
    font-weight: 900;
    margin: 4px 0 18px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
}
.rule-badge.forward { background: #c8f7c5; color: #2e7d32; border: 3px solid #4CAF50; }
.rule-badge.backward { background: #ffe0b2; color: #e65100; border: 3px solid #fb8c00; }

/* Sequence display */
.sequence-display {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 4px;
    margin: 18px 0;
}
.seq-box {
    min-width: 58px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.35em;
    font-weight: 900;
    background: #fff9e6;
    border: 3px solid #ffd700;
    border-radius: 12px;
    color: #555;
    padding: 4px 6px;
}
.seq-box.blank {
    background: #fff;
    border-color: #146c8e;
    color: #146c8e;
    animation: pulseBlank 1.4s ease infinite;
}
.seq-arrow { font-size: 1.3em; color: #b0b0b0; margin: 0 2px; }

@keyframes pulseBlank {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}

/* Feedback */
.feedback {
    font-size: 1.3em;
    margin: 14px 0;
    min-height: 36px;
    font-weight: bold;
}
.feedback.correct { color: #4CAF50; animation: bounce 0.5s ease; }
.feedback.incorrect { color: #f5576c; animation: shake 0.3s ease; }

@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

/* Answer box */
.answer-box {
    background: #f7f7f7;
    border: 3px solid #ddd;
    border-radius: 14px;
    padding: 12px;
    text-align: center;
    font-size: 2em;
    font-weight: 900;
    color: #999;
    min-height: 56px;
    margin: 6px 0 16px;
    letter-spacing: 3px;
    transition: border-color .2s, color .2s;
}
.answer-box.has-value { border-color: #146c8e; color: #146c8e; }

/* Numpad */
.numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 18px;
}
.num-btn {
    padding: 15px;
    font-size: 1.25em;
    font-weight: 900;
    border: 3px solid #2193b0;
    background: white;
    color: #2193b0;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
}
.num-btn:hover { background: #2193b0; color: white; }
.num-btn.del-btn { border-color: #f5576c; color: #f5576c; font-size: 1.05em; }
.num-btn.del-btn:hover { background: #f5576c; color: white; }

.submit-btn {
    background: linear-gradient(135deg, #ffd76e 0%, #ffb300 100%);
    color: #5a3d00;
    border: none;
    padding: 15px 40px;
    font-size: 1.25em;
    font-weight: bold;
    border-radius: 25px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(255, 179, 0, 0.35);
    width: 100%;
}
.submit-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255, 179, 0, 0.5); }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* Game Over */
.game-over-content { margin: 30px 0; }
.celebration { font-size: 3em; animation: spin 1s linear infinite; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.game-over-message { font-size: 1.4em; color: #333; margin: 16px 0; }
.final-score { font-size: 2.6em; color: #d4a017; font-weight: bold; margin: 16px 0; }
.advancement-message { font-size: 1.1em; color: #f5576c; margin: 12px 0; font-weight: bold; min-height: 1.4em; }

.back-btn, .choose-btn {
    background: #2193b0;
    color: white;
    border: none;
    padding: 12px 26px;
    font-size: 1.05em;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    margin: 10px 6px;
}
.back-btn:hover, .choose-btn:hover { background: #146c8e; }

.next-btn {
    background: linear-gradient(135deg, #ffd76e 0%, #ffb300 100%);
    color: #5a3d00;
    border: none;
    padding: 12px 26px;
    font-size: 1.05em;
    font-weight: bold;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    margin: 10px 6px;
    box-shadow: 0 5px 15px rgba(255, 179, 0, 0.3);
}
.next-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255, 179, 0, 0.5); }
.next-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

@media (max-width: 600px) {
    .container { padding: 20px; }
    h1 { font-size: 2em; }
    .level-selection { grid-template-columns: 1fr; }
    .numpad { grid-template-columns: repeat(3, 1fr); }
    .seq-box { min-width: 48px; height: 48px; font-size: 1.1em; }
}
</style>
</head>
<body>
<div style="background:#CDEFF6;position:relative;overflow:hidden;padding:14px 22px;">
  <div style="position:absolute;top:6px;left:36%;width:64px;height:22px;background:#fff;border-radius:999px;opacity:.85;"></div>
  <div style="position:absolute;top:20px;left:42%;width:40px;height:16px;background:#fff;border-radius:999px;opacity:.85;"></div>
  <a href="../index.html" style="position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:1rem;color:#2B2440;text-decoration:none;">
    <span style="font-size:1.2rem;line-height:1;">&larr;</span>Back to Mrs K's Learning Zone
  </a>
</div>
<div class="page-wrap">
<div class="container">

    <!-- Level Selection Screen -->
    <div class="screen active" id="levelScreen">
        <h1>🤿 Treasure Dive Counting 🤿</h1>
        <p class="subtitle">Skip count by 10s to find sunken treasure!</p>

        <div class="level-selection">
            <button class="level-btn" onclick="startLevel(1)">
                <div>Level 1</div>
                <div class="level-label">Diving Down &middot; Counting Forwards</div>
            </button>
            <button class="level-btn level2" onclick="startLevel(2)">
                <div>Level 2</div>
                <div class="level-label">Swimming Up &middot; Counting Backwards</div>
            </button>
            <button class="level-btn level3" onclick="startLevel(3)">
                <div>Level 3</div>
                <div class="level-label">Current Swirl &middot; Forwards &amp; Backwards</div>
            </button>
            <button class="level-btn level4" onclick="startLevel(4)">
                <div>Level 4</div>
                <div class="level-label">Deep Sea Mystery &middot; Start Anywhere</div>
            </button>
        </div>
    </div>

    <!-- Game Screen -->
    <div class="screen" id="gameScreen">
        <div class="game-header">
            <span class="level-display" id="levelDisplay"></span>
            <span class="score-display">Score: <span id="score">0</span></span>
        </div>
        <div class="question-counter" id="questionCounter"></div>

        <div class="ocean-path">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar">
                    <span class="diver-emoji">🤿</span>
                </div>
            </div>
        </div>

        <div class="rule-badge" id="ruleBadge">Rule: +10</div>

        <div class="sequence-display" id="sequenceDisplay"></div>

        <div class="feedback" id="feedback"></div>

        <div class="answer-box" id="answerBox">?</div>

        <div class="numpad" id="numpad">
            <button class="num-btn" onclick="numPress('1')">1</button>
            <button class="num-btn" onclick="numPress('2')">2</button>
            <button class="num-btn" onclick="numPress('3')">3</button>
            <button class="num-btn" onclick="numPress('4')">4</button>
            <button class="num-btn" onclick="numPress('5')">5</button>
            <button class="num-btn" onclick="numPress('6')">6</button>
            <button class="num-btn" onclick="numPress('7')">7</button>
            <button class="num-btn" onclick="numPress('8')">8</button>
            <button class="num-btn" onclick="numPress('9')">9</button>
            <button class="num-btn" onclick="numPress('0')">0</button>
            <button class="num-btn del-btn" onclick="numDelete()">⌫</button>
            <button class="num-btn" onclick="numPress('00')">00</button>
        </div>

        <button class="submit-btn" id="submitBtn" onclick="submitAnswer()" disabled>Check Answer ✓</button>
    </div>

    <!-- Game Over Screen -->
    <div class="screen" id="gameOverScreen">
        <h1>Level Complete!</h1>
        <div class="game-over-content">
            <div class="celebration" id="celebration">🤿</div>
            <div class="game-over-message" id="gameOverMessage">Great diving!</div>
            <div class="final-score" id="finalScore">0 points</div>
            <div class="advancement-message" id="advancementMessage"></div>
            <div>
                <button class="back-btn" onclick="playAgain()">Play Again</button>
                <button class="next-btn" id="nextLevelBtn" onclick="nextLevel()">Next Level</button>
                <button class="choose-btn" onclick="backToLevels()">Choose Level</button>
            </div>
        </div>
    </div>

</div>
</div>

<script>
    const SKIP = 10;
    const SEQ_LEN = 5;
    const QUESTIONS_PER_LEVEL = 8;
    const PASS_THRESHOLD = 6;

    const LEVEL_INFO = [
        null,
        { name: 'Level 1', desc: 'Counting Forwards' },
        { name: 'Level 2', desc: 'Counting Backwards' },
        { name: 'Level 3', desc: 'Forwards & Backwards' },
        { name: 'Level 4', desc: 'Start Anywhere' }
    ];

    let currentLevel = 1;
    let score = 0;
    let questionsAnswered = 0;
    let sequence = [];
    let blankIndex = 0;
    let correctAnswer = 0;
    let direction = 1;
    let answerInput = '';
    let waitingForAnswer = false;

    function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function randomMultiple(n, min, max) {
        const lo = Math.ceil(min / n);
        const hi = Math.floor(max / n);
        return randInt(lo, hi) * n;
    }

    function startLevel(level) {
        currentLevel = level;
        score = 0;
        questionsAnswered = 0;

        document.getElementById('levelScreen').classList.remove('active');
        document.getElementById('gameOverScreen').classList.remove('active');
        document.getElementById('gameScreen').classList.add('active');

        const info = LEVEL_INFO[level];
        document.getElementById('levelDisplay').textContent = `${info.name}: ${info.desc}`;
        document.getElementById('score').textContent = '0';
        document.getElementById('progressBar').style.width = '0%';

        generateQuestion();
    }

    function generateQuestion() {
        const span = (SEQ_LEN - 1) * SKIP;
        let start;

        if (currentLevel === 1) {
            direction = 1;
            start = randomMultiple(SKIP, 0, 120 - span);
        } else if (currentLevel === 2) {
            direction = -1;
            start = randomMultiple(SKIP, span, 120);
        } else if (currentLevel === 3) {
            direction = Math.random() < 0.5 ? 1 : -1;
            start = direction === 1
                ? randomMultiple(SKIP, 0, 120 - span)
                : randomMultiple(SKIP, span, 120);
        } else {
            direction = Math.random() < 0.5 ? 1 : -1;
            start = direction === 1
                ? randInt(0, 120 - span)
                : randInt(span, 120);
        }

        sequence = [];
        for (let i = 0; i < SEQ_LEN; i++) {
            sequence.push(start + direction * i * SKIP);
        }

        blankIndex = randInt(1, SEQ_LEN - 1);
        correctAnswer = sequence[blankIndex];
        answerInput = '';
        waitingForAnswer = true;

        renderSequence();
        renderRule();
        updateAnswerDisplay();
        disableNumpad(false);
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('feedback').textContent = '';
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('questionCounter').textContent =
            `Question ${questionsAnswered + 1} of ${QUESTIONS_PER_LEVEL}`;
    }

    function renderSequence() {
        const container = document.getElementById('sequenceDisplay');
        container.innerHTML = '';
        sequence.forEach((num, i) => {
            if (i > 0) {
                const arrow = document.createElement('span');
                arrow.className = 'seq-arrow';
                arrow.textContent = '→';
                container.appendChild(arrow);
            }
            const box = document.createElement('div');
            box.className = 'seq-box' + (i === blankIndex ? ' blank' : '');
            box.textContent = i === blankIndex ? '?' : num;
            container.appendChild(box);
        });
    }

    function renderRule() {
        const badge = document.getElementById('ruleBadge');
        badge.textContent = `Rule: ${direction === 1 ? '+' : '-'}${SKIP}`;
        badge.className = 'rule-badge ' + (direction === 1 ? 'forward' : 'backward');
    }

    function disableNumpad(off) {
        const numpad = document.getElementById('numpad');
        numpad.style.opacity = off ? '.4' : '1';
        numpad.style.pointerEvents = off ? 'none' : 'all';
    }

    function numPress(val) {
        if (!waitingForAnswer) return;
        const combined = answerInput + val;
        if (combined.length > 3) return;
        if (parseInt(combined, 10) > 120) return;
        answerInput = combined;
        updateAnswerDisplay();
        document.getElementById('submitBtn').disabled = answerInput === '';
    }

    function numDelete() {
        if (!waitingForAnswer) return;
        answerInput = answerInput.slice(0, -1);
        updateAnswerDisplay();
        document.getElementById('submitBtn').disabled = answerInput === '';
    }

    function updateAnswerDisplay() {
        const box = document.getElementById('answerBox');
        box.textContent = answerInput || '?';
        box.className = 'answer-box' + (answerInput ? ' has-value' : '');
    }

    function submitAnswer() {
        if (!waitingForAnswer || answerInput === '') return;
        waitingForAnswer = false;
        disableNumpad(true);
        document.getElementById('submitBtn').disabled = true;

        const given = parseInt(answerInput, 10);
        const feedback = document.getElementById('feedback');

        if (given === correctAnswer) {
            score++;
            document.getElementById('score').textContent = score;
            document.getElementById('progressBar').style.width =
                (score / QUESTIONS_PER_LEVEL) * 100 + '%';
            feedback.textContent = '🤿 Correct! Diving deeper!';
            feedback.className = 'feedback correct';
        } else {
            feedback.textContent = `Not quite! The answer was ${correctAnswer}.`;
            feedback.className = 'feedback incorrect';
        }

        questionsAnswered++;

        setTimeout(() => {
            if (questionsAnswered >= QUESTIONS_PER_LEVEL) {
                endLevel();
            } else {
                generateQuestion();
            }
        }, 1600);
    }

    function endLevel() {
        document.getElementById('gameScreen').classList.remove('active');
        document.getElementById('gameOverScreen').classList.add('active');
        document.getElementById('finalScore').textContent = `${score} / ${QUESTIONS_PER_LEVEL} correct!`;

        const nextBtn = document.getElementById('nextLevelBtn');
        const advMsg = document.getElementById('advancementMessage');
        const canAdvance = score >= PASS_THRESHOLD;
        const isMaxLevel = currentLevel >= 4;

        if (canAdvance && !isMaxLevel) {
            nextBtn.disabled = false;
            nextBtn.textContent = 'Next Level';
            advMsg.textContent = '✨ You can go to the next level! ✨';
        } else if (isMaxLevel && canAdvance) {
            nextBtn.disabled = true;
            nextBtn.textContent = 'You finished them all! 🎉';
            advMsg.textContent = '';
        } else {
            nextBtn.disabled = true;
            nextBtn.textContent = 'Next Level';
            advMsg.textContent = `Get ${PASS_THRESHOLD} correct to unlock the next level!`;
        }

        const celebration = document.getElementById('celebration');
        const message = document.getElementById('gameOverMessage');
        if (score === QUESTIONS_PER_LEVEL) {
            celebration.textContent = '🤿💰🤿';
            message.textContent = "Perfect! You're a skip-counting star!";
        } else if (score >= QUESTIONS_PER_LEVEL * 0.75) {
            celebration.textContent = '🤿✨';
            message.textContent = 'Excellent diving!';
        } else if (score >= QUESTIONS_PER_LEVEL * 0.5) {
            celebration.textContent = '🤿';
            message.textContent = 'Good diving! Try again!';
        } else {
            celebration.textContent = '🤿💭';
            message.textContent = "Keep practicing! You'll get there!";
        }
    }

    function playAgain() {
        startLevel(currentLevel);
    }

    function nextLevel() {
        if (currentLevel < 4) startLevel(currentLevel + 1);
    }

    function backToLevels() {
        document.getElementById('gameOverScreen').classList.remove('active');
        document.getElementById('gameScreen').classList.remove('active');
        document.getElementById('levelScreen').classList.add('active');
    }
</script>
</body>
</html>
