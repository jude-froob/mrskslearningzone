<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Pattern Jumper - Number Patterns Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', cursive, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .page-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 40px;
        }

        /* Level Selection Screen */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .level-selection {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin: 40px 0;
        }

        .level-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 30px 20px;
            border-radius: 20px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .level-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.5);
        }

        .level-btn.level2 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.3);
        }

        .level-btn.level2:hover {
            box-shadow: 0 15px 35px rgba(245, 87, 108, 0.5);
        }

        .level-btn.level3 {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 10px 25px rgba(79, 172, 254, 0.3);
        }

        .level-btn.level3:hover {
            box-shadow: 0 15px 35px rgba(79, 172, 254, 0.5);
        }

        .level-label {
            font-size: 0.8em;
            opacity: 0.9;
            margin-top: 10px;
        }

        /* Game Screen */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 15px;
        }

        .level-display {
            font-size: 1.1em;
            font-weight: bold;
            color: #667eea;
        }

        .score-display {
            font-size: 1.5em;
            font-weight: bold;
            color: #764ba2;
        }

        /* Frog and Progress */
        .pond {
            background: linear-gradient(to bottom, #87ceeb, #90ee90);
            border-radius: 20px;
            padding: 25px;
            margin: 30px 0;
            position: relative;
            border: 3px solid #4CAF50;
        }

        .progress-bar-container {
            background: #90ee90;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #66BB6A;
            height: 50px;
            position: relative;
            display: flex;
            align-items: center;
        }

        .progress-bar {
            background: linear-gradient(90deg, #66BB6A, #4CAF50);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
        }

        .frog-emoji {
            font-size: 2.5em;
            filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.2));
        }

        /* Pattern and Input */
        .pattern-display {
            background: #fff9e6;
            border: 3px solid #FFD700;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            min-height: 80px;
        }

        .pattern-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }

        .pattern-numbers {
            font-size: 2.5em;
            font-weight: bold;
            letter-spacing: 15px;
            font-family: 'Arial', sans-serif;
        }

        .pattern-num {
            display: inline-block;
            min-width: 1.2em;
        }

        .pattern-num.color1 {
            color: #667eea;
        }

        .pattern-num.color2 {
            color: #f5576c;
        }

        .input-section {
            margin: 30px 0;
        }

        .input-label {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .rule-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .rule-btn {
            padding: 15px;
            font-size: 1.2em;
            font-weight: bold;
            border: 3px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Arial Rounded MT Bold', sans-serif;
        }

        .rule-btn:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .rule-btn.selected {
            background: #667eea;
            color: white;
        }

        .submit-section {
            margin-top: 20px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #66BB6A 0%, #4CAF50 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.5);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Feedback */
        .feedback {
            font-size: 1.5em;
            margin: 20px 0;
            min-height: 40px;
            font-weight: bold;
        }

        .feedback.correct {
            color: #4CAF50;
            animation: bounce 0.5s ease;
        }

        .feedback.incorrect {
            color: #f5576c;
            animation: shake 0.3s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Game Over Screen */
        .game-over-content {
            margin: 40px 0;
        }

        .final-score {
            font-size: 3em;
            color: #764ba2;
            font-weight: bold;
            margin: 20px 0;
        }

        .game-over-message {
            font-size: 1.5em;
            color: #333;
            margin: 20px 0;
        }

        .celebration {
            font-size: 3em;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 15px 10px;
        }

        .back-btn:hover {
            background: #764ba2;
        }

        .next-btn {
            background: linear-gradient(135deg, #66BB6A 0%, #4CAF50 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 15px 10px;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .next-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.5);
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .advancement-message {
            font-size: 1.2em;
            color: #f5576c;
            margin: 15px 0;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .level-selection {
                grid-template-columns: 1fr;
            }

            .rule-buttons {
                grid-template-columns: repeat(2, 1fr);
            }

            .pattern-numbers {
                font-size: 1.8em;
                letter-spacing: 10px;
            }

            .game-header {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
<div style="background:#CDEFF6;position:relative;overflow:hidden;padding:14px 22px;">
  <div style="position:absolute;top:6px;left:36%;width:64px;height:22px;background:#fff;border-radius:999px;opacity:.85;"></div>
  <div style="position:absolute;top:20px;left:42%;width:40px;height:16px;background:#fff;border-radius:999px;opacity:.85;"></div>
  <a href="../index.html" style="position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:1rem;color:#2B2440;text-decoration:none;">
    <span style="font-size:1.2rem;line-height:1;">&larr;</span>Back to Mrs K's Learning Zone
  </a>
</div>
<div class="page-wrap">
    <div class="container">
        <!-- Level Selection Screen -->
        <div class="screen active" id="levelScreen">
            <h1>🐸 Number Pattern Jumper 🐸</h1>
            <p class="subtitle">What's the jumping rule?</p>

            <div class="level-selection">
                <button class="level-btn" onclick="startGame(1)">
                    <div>Level 1</div>
                    <div class="level-label">Easy Start</div>
                </button>
                <button class="level-btn level2" onclick="startGame(2)">
                    <div>Level 2</div>
                    <div class="level-label">Getting Tricky</div>
                </button>
                <button class="level-btn level3" onclick="startGame(3)">
                    <div>Level 3</div>
                    <div class="level-label">Super Froggy!</div>
                </button>
            </div>
        </div>

        <!-- Game Screen -->
        <div class="screen" id="gameScreen">
            <div class="game-header">
                <span class="level-display" id="levelDisplay"></span>
                <span class="score-display">Score: <span id="score">0</span></span>
            </div>

            <div class="pond">
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar">
                        <span class="frog-emoji">🐸</span>
                    </div>
                </div>
            </div>

            <div class="pattern-display">
                <div class="pattern-label">Find the pattern:</div>
                <div class="pattern-numbers" id="patternNumbers"></div>
            </div>

            <div class="feedback" id="feedback"></div>

            <div class="input-section">
                <div class="input-label">How many is the frog jumping each time?</div>
                <div class="rule-buttons" id="ruleButtons"></div>
            </div>

            <div class="submit-section">
                <button class="submit-btn" onclick="checkAnswer()">Check Answer ✓</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div class="screen" id="gameOverScreen">
            <h1>Game Over!</h1>
            <div class="game-over-content">
                <div class="celebration" id="celebration">🐸</div>
                <div class="game-over-message" id="gameOverMessage">Great jumping!</div>
                <div class="final-score" id="finalScore">0 points</div>
                <div class="advancement-message" id="advancementMessage"></div>
                <div>
                    <button class="back-btn" onclick="playAgain()">Play Again</button>
                    <button class="next-btn" id="nextLevelBtn" onclick="nextLevel()">Next Level</button>
                </div>
            </div>
        </div>
    </div>
</div>

    <script>
        let currentLevel = 1;
        let score = 0;
        let questionsAnswered = 0;
        let currentPattern = [];
        let currentRule = null;
        let selectedRule = null;
        const questionsPerGame = 8;

        const rules = {
            '+1': 1,
            '+2': 2,
            '+5': 5,
            '+10': 10
        };

        function startGame(level) {
            currentLevel = level;
            score = 0;
            questionsAnswered = 0;
            selectedRule = null;

            document.getElementById('levelScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
            document.getElementById('levelDisplay').textContent = `Level ${level}`;

            generateQuestion();
        }

        function generateQuestion() {
            const ruleKeys = Object.keys(rules);
            currentRule = ruleKeys[Math.floor(Math.random() * ruleKeys.length)];
            const increment = rules[currentRule];

            let start;
            if (currentLevel === 1) {
                // Easy: start from 0 or appropriate multiples
                if (Math.abs(increment) === 5) {
                    start = Math.floor(Math.random() * 3) * 5; // 0, 5, 10
                } else if (Math.abs(increment) === 2) {
                    start = Math.floor(Math.random() * 5) * 2; // 0, 2, 4, 6, 8
                } else if (Math.abs(increment) === 10) {
                    start = Math.floor(Math.random() * 3) * 10; // 0, 10, 20
                } else {
                    start = 0;
                }
            } else if (currentLevel === 2) {
                // Medium: start from larger appropriate multiples
                if (Math.abs(increment) === 5) {
                    start = (Math.floor(Math.random() * 5) + 1) * 5; // 5, 10, 15, 20, 25
                } else if (Math.abs(increment) === 2) {
                    start = (Math.floor(Math.random() * 10) + 1) * 2; // 2, 4, 6, ..., 20
                } else if (Math.abs(increment) === 10) {
                    start = (Math.floor(Math.random() * 3) + 1) * 10; // 10, 20, 30
                } else {
                    start = Math.floor(Math.random() * 20) + 5; // 5-24
                }
            } else {
                // Hard: start from any number (respecting 120 limit)
                start = Math.floor(Math.random() * 60);
            }

            // Generate pattern
            currentPattern = [start];
            let current = start;
            let patternLength = 4 + Math.floor(Math.random() * 2); // 4-5 numbers

            for (let i = 1; i < patternLength; i++) {
                current += increment;
                if (current > 120) {
                    current -= increment;
                    break;
                }
                currentPattern.push(current);
            }

            displayPattern();
            setupRuleButtons();
            selectedRule = null;
            document.getElementById('feedback').textContent = '';
        }

        function displayPattern() {
            const container = document.getElementById('patternNumbers');
            container.innerHTML = '';

            currentPattern.forEach((num, index) => {
                const span = document.createElement('span');
                span.className = `pattern-num color${(index % 2) + 1}`;
                span.textContent = num;
                container.appendChild(span);

                // Add spacing between numbers
                if (index < currentPattern.length - 1) {
                    container.appendChild(document.createTextNode('   '));
                }
            });
        }

        function setupRuleButtons() {
            const container = document.getElementById('ruleButtons');
            container.innerHTML = '';

            // Get 4 different rules (including the correct one)
            const allRules = Object.keys(rules);
            const options = new Set([currentRule]);

            while (options.size < 4) {
                const random = allRules[Math.floor(Math.random() * allRules.length)];
                options.add(random);
            }

            const optionsArray = Array.from(options).sort(() => Math.random() - 0.5);

            optionsArray.forEach(rule => {
                const btn = document.createElement('button');
                btn.className = 'rule-btn';
                btn.textContent = rule;
                btn.onclick = () => selectRule(rule, btn);
                container.appendChild(btn);
            });
        }

        function selectRule(rule, button) {
            // Remove previous selection
            document.querySelectorAll('.rule-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            // Add selection to clicked button
            button.classList.add('selected');
            selectedRule = rule;
        }

        function checkAnswer() {
            if (selectedRule === null) {
                document.getElementById('feedback').textContent = 'Pick a rule first! 👆';
                document.getElementById('feedback').className = 'feedback incorrect';
                return;
            }

            const feedback = document.getElementById('feedback');

            if (selectedRule === currentRule) {
                score++;
                feedback.textContent = '✨ Correct! Amazing! ✨';
                feedback.className = 'feedback correct';
                jumpFrog();
            } else {
                feedback.textContent = `Not quite! It was ${currentRule}. Keep trying! 💪`;
                feedback.className = 'feedback incorrect';
            }

            questionsAnswered++;

            if (questionsAnswered >= questionsPerGame) {
                setTimeout(endGame, 1500);
            } else {
                setTimeout(generateQuestion, 1500);
            }
        }

        function jumpFrog() {
            const progressBar = document.getElementById('progressBar');
            const progressPercentage = (score / questionsPerGame) * 100;
            progressBar.style.width = progressPercentage + '%';
        }

        function endGame() {
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('gameOverScreen').classList.add('active');
            document.getElementById('finalScore').textContent = `${score} / ${questionsPerGame} correct!`;

            const nextLevelBtn = document.getElementById('nextLevelBtn');
            const advancementMsg = document.getElementById('advancementMessage');
            const canAdvance = score >= 6;
            const isMaxLevel = currentLevel >= 3;

            // Update button visibility and state
            if (canAdvance && !isMaxLevel) {
                nextLevelBtn.disabled = false;
                advancementMsg.textContent = '✨ You can go to the next level! ✨';
            } else if (isMaxLevel && canAdvance) {
                nextLevelBtn.disabled = true;
                nextLevelBtn.textContent = 'You reached Level 3! 🎉';
                advancementMsg.textContent = '';
            } else {
                nextLevelBtn.disabled = true;
                advancementMsg.textContent = 'Get 6 correct to unlock the next level!';
            }

            if (score === questionsPerGame) {
                document.getElementById('celebration').textContent = '🐸🎉🐸';
                document.querySelector('.game-over-message').textContent = 'Perfect! You\'re a pattern master!';
            } else if (score >= questionsPerGame * 0.75) {
                document.getElementById('celebration').textContent = '🐸✨';
                document.querySelector('.game-over-message').textContent = 'Excellent jumping!';
            } else if (score >= questionsPerGame * 0.5) {
                document.querySelector('.game-over-message').textContent = 'Good hopping! Try again!';
            } else {
                document.querySelector('.game-over-message').textContent = 'Keep practicing! You\'ll get there! 💚';
            }

            document.getElementById('score').textContent = score;
        }

        function playAgain() {
            document.getElementById('gameOverScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
            score = 0;
            questionsAnswered = 0;
            selectedRule = null;
            document.getElementById('score').textContent = '0';
            document.getElementById('feedback').textContent = '';
            document.getElementById('progressBar').style.width = '0%';
            generateQuestion();
        }

        function nextLevel() {
            if (currentLevel < 3) {
                document.getElementById('gameOverScreen').classList.remove('active');
                startGame(currentLevel + 1);
            }
        }
    </script>
</body>
</html>
